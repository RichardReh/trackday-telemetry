spring.application.name=vehicle-telemetry

server.port=8080
server.address=127.0.0.1

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/telemetry
spring.datasource.username=telemetry
spring.datasource.password=local_dev_password

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=localhost:29092

# Consumer
spring.kafka.consumer.group-id=telemetry-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# DB Sequence gap timeout
telemetry.sequence-gap.timeout=30s